[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenariochef"
version = "0.1.0"
description = "Automated OpenSCENARIO scenario generation, validation, and esmini simulation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScenarioChef Contributors" }]
keywords = ["openscenario", "esmini", "simulation", "scenario-generation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
scenariochef = "scenariochef.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scenariochef"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scenariochef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
