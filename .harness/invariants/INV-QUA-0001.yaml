id: INV-QUA-0001
rule: C8 reports a minimum inter-actor distance metric (min_dist) alongside TTC/PET for every actor pair when state data exists; it is reported-only and never auto-fails an objective unless a rulebook threshold says so
trigger:
- removing or renaming the min_dist metric
- making min_dist auto-fail objectives without a rulebook threshold entry
- computing min_dist from anything other than the same aligned frames used for TTC/PET
